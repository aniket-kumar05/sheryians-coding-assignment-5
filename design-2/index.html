<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Explore Art Work | Marvel Edition</title>
  <link rel="stylesheet" href="style.css">
  <!-- Modern Typography -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
</head>
<body>
  <div class="main-container">
    <header class="section-header">
      <h1>Explore Art Work</h1>
      <a href="#" class="see-all">See All</a>
    </header>

    <div class="art-grid">
      <div class="art-card">
        <div class="img-container">
          <img src="images/ironman.jpg" alt="Iron Man">
        </div>
        <div class="card-info">
          <div class="title-row">
            <h3>Iron Man</h3>
            <span class="likes">88.6k <span class="heart">❤️</span></span>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="art-card">
        <div class="img-container">
          <img src="images/cap.jpg" alt="Captain America">
        </div>
        <div class="card-info">
          <div class="title-row">
            <h3>Cap America</h3>
            <span class="likes">78.9k <span class="heart">❤️</span></span>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="art-card">
        <div class="img-container">
          <img src="images/thor.jpg" alt="Thor">
        </div>
        <div class="card-info">
          <div class="title-row">
            <h3>Thor Odinson</h3>
            <span class="likes">92.4k <span class="heart">❤️</span></span>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="art-card">
        <div class="img-container">
          <img src="images/blackp.jpg" alt="Black Panther">
        </div>
        <div class="card-info">
          <div class="title-row">
            <h3>Black Panther</h3>
            <span class="likes">65.2k <span class="heart">❤️</span></span>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="art-card">
        <div class="img-container">
          <img src="images/hulk.jpg" alt="Hulk">
        </div>
        <div class="card-info">
          <div class="title-row">
            <h3>The Hulk</h3>
            <span class="likes">45.7k <span class="heart">❤️</span></span>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="art-card">
        <div class="img-container">
          <img src="images/scarlet.jpg" alt="Scarlet Witch">
        </div>
        <div class="card-info">
          <div class="title-row">
            <h3>Scarlet Witch</h3>
            <span class="likes">98.6k <span class="heart">❤️</span></span>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="art-card">
        <div class="img-container">
          <img src="images/hawk.jpg" alt="Hawkeye">
        </div>
        <div class="card-info">
          <div class="title-row">
            <h3>Hawkeye</h3>
            <span class="likes">32.4k <span class="heart">❤️</span></span>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

      <div class="art-card">
        <div class="img-container">
          <img src="images/hank.jpg" alt="Ant Man">
        </div>
        <div class="card-info">
          <div class="title-row">
            <h3>Ant Man</h3>
            <span class="likes">24.8k <span class="heart">❤️</span></span>
          </div>
          <button class="bid-btn">Place Bid</button>
        </div>
      </div>

    </div>
  </div>
</body>
</html>
